name: Publish Murdilimax Swap to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'swap/**'
      - '.github/workflows/murdilimax-swap-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: murdilimax-swap-pages
  cancel-in-progress: false
jobs:
  deploy:
    name: Build and deploy the production swap site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build real swap site
        shell: bash
        env:
          THORCHAIN_AFFILIATE_KEY: ${{ secrets.THORCHAIN_AFFILIATE_KEY }}
        run: |
          set -euo pipefail
          node --check swap/widget.js
          node --check swap/i18n.js
          node swap/build.cjs
          node swap/seo-test.cjs
          test -s swap/dist/index.html
          test -s swap/dist/config.js
          test -s swap/dist/sitemap.xml
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: swap/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
