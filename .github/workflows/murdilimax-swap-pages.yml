name: Publish Murdilimax Swap Preview
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/murdilimax-swap-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: 'murdilimax-swap-pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare isolated site artifact
        run: |
          mkdir -p ./_site
          cp index.html ./_site/index.html
          touch ./_site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
